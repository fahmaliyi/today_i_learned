name: today_i_learned
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.6.1
  dynamic_color: ^1.9.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-Variable.ttf
          style: italic
